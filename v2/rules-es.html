<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Prevent caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Táctico: Reglas del Juego</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(59, 130, 246, 0.2);
            --border-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            background-image: 
                radial-gradient(circle at 5% 10%, rgba(6, 182, 212, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 95% 85%, rgba(59, 130, 246, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top HUD / Status Bar */
        .hud-bar {
            width: 100%;
            background: rgba(17, 24, 39, 0.9);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hud-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .hud-title {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Nav Container */
        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s, text-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .nav-links a.active {
            color: var(--accent-cyan);
            font-weight: 600;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 2px;
        }

        /* Layout Grid */
        .container {
            width: 100%;
            max-width: 1100px;
            padding: 3rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 280px 1fr;
            }
        }

        /* Sidebar - Table of Contents */
        .sidebar {
            position: sticky;
            top: 5rem;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-glow);
        }

        .sidebar-title {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
            padding-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar for TOC */
        .toc-list::-webkit-scrollbar {
            width: 4px;
        }
        .toc-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .toc-list::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.3);
            border-radius: 2px;
        }

        .toc-item a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s, padding-left 0.2s;
            display: block;
            border-left: 2px solid transparent;
            padding-left: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-item a:hover {
            color: var(--accent-cyan);
            padding-left: 0.75rem;
            border-left-color: var(--accent-cyan);
        }

        .quick-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .quick-info-row span:last-child {
            color: var(--text-primary);
        }

        /* Main Content Panel */
        .main-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 1rem;
            padding: 2rem 2.5rem;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-glow);
            border-top: 4px solid var(--accent-cyan);
        }

        @media (max-width: 600px) {
            .main-card {
                padding: 1.5rem;
            }
        }

        /* Markdown Render Styling */
        #content {
            font-size: 1.02rem;
        }

        /* Headings */
        #content h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f3f4f6 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 0.75rem;
        }

        #content h2 {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            scroll-margin-top: 5.5rem; /* prevent being covered by sticky HUD */
        }

        #content h2::before {
            content: "◼";
            font-size: 0.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
        }

        #content h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            scroll-margin-top: 5.5rem;
        }

        #content h3::before {
            content: "▷";
            font-size: 0.9rem;
            color: var(--accent-blue);
        }

        /* Paragraphs & Text */
        #content p {
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
        }

        #content strong {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.1rem 0.3rem;
            border-radius: 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dividers */
        #content hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, rgba(59, 130, 246, 0), rgba(59, 130, 246, 0.4), rgba(59, 130, 246, 0));
            margin: 2.5rem 0;
        }

        /* Lists */
        #content ul, #content ol {
            margin-bottom: 1.5rem;
            padding-left: 0.5rem;
        }

        #content ul {
            list-style: none;
        }

        #content li {
            position: relative;
            padding-left: 1.75rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        #content ul > li::before {
            content: "";
            position: absolute;
            left: 0.5rem;
            top: 0.65rem;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-cyan);
        }

        /* Handle ordered lists nicely */
        #content ol {
            counter-reset: o-list;
            list-style: none;
        }

        #content ol > li {
            counter-increment: o-list;
        }

        #content ol > li::before {
            content: counter(o-list) ".";
            position: absolute;
            left: 0.25rem;
            top: 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        /* Nested lists */
        #content li ul, #content li ol {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        #content li ul li {
            font-size: 0.95rem;
        }

        #content li ul li::before {
            background: var(--accent-blue);
            box-shadow: 0 0 6px var(--accent-blue);
            border-radius: 0;
            transform: rotate(45deg);
            width: 5px;
            height: 5px;
            top: 0.7rem;
        }

        /* Highlight note styles */
        #content .note, #content blockquote {
            background: rgba(59, 130, 246, 0.05);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 1.25rem 1.5rem;
            margin: 1.5rem 0;
        }

        #content .note p, #content blockquote p {
            margin-bottom: 0;
            font-style: italic;
            color: var(--text-primary);
        }

        /* Links inside markdown */
        #content a {
            color: var(--accent-cyan);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-cyan);
            transition: color 0.2s, border-bottom-color 0.2s;
        }

        #content a:hover {
            color: var(--text-primary);
            border-bottom-style: solid;
            border-bottom-color: var(--text-primary);
        }

        /* Action Buttons */
        .cta-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-cyan);
            color: #000;
        }

        .btn-primary:hover {
            background-color: #22d3ee;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Loading Animation */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 0;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            gap: 1.5rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-cyan);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Back to top button */
        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--text-secondary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
            visibility: hidden;
            z-index: 99;
            backdrop-filter: blur(8px);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            color: var(--text-primary);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- HUD Status Bar -->
    <div class="hud-bar">
        <div class="hud-status">
            <span class="hud-dot"></span>
            <span>TERMINAL SEGURO: ONLINE</span>
        </div>
        <div class="hud-title">TEATRO DE GUERRA // REGLAS</div>
        <div class="nav-links">
            <a href="intro.html">Introducción</a>
            <a href="rules-es.html" class="active">Reglas</a>
            <a href="rules.html">English</a>
            <a href="../counters.html">Contadores</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Sticky Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">CENTRO DE MANDO</div>
                <div class="quick-info-row">
                    <span>SEGURIDAD:</span>
                    <span style="color: var(--accent-amber); font-weight: bold;">CLASIFICADO</span>
                </div>
                <div class="quick-info-row">
                    <span>ESTADO:</span>
                    <span style="color: var(--accent-green); font-weight: bold;">OPERATIVO</span>
                </div>
                <div class="quick-info-row">
                    <span>SECTOR:</span>
                    <span>REGLAS TÁCTICAS</span>
                </div>
                <div class="quick-info-row">
                    <span>VERSIÓN:</span>
                    <span>v2.0 (BETA)</span>
                </div>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-title">SECCIONES</div>
                <ul class="toc-list" id="toc-container">
                    <li class="toc-item"><a href="#content">Cargando secciones...</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Briefing Content -->
        <main class="main-card">
            <!-- Container where the parsed Markdown will be rendered -->
            <div id="content">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <div>DESENCRIPTANDO REGLAS DE JUEGO...</div>
                </div>
            </div>

            <!-- Call to Actions -->
            <div class="cta-container">
                <a href="intro.html" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.25rem;">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Volver a la Intro
                </a>
                <a href="../counters.html" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.25rem;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="3" y1="15" x2="21" y2="15"></line>
                    </svg>
                    Iniciar Contadores
                </a>
            </div>
        </main>
    </div>

    <!-- Back to top button -->
    <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- Load marked parser from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetch('rules-es.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load rules-es.md');
                    }
                    return response.text();
                })
                .then(markdown => {
                    const headingIdMap = {
                        "objetivo del juego": "objective",
                        "configuración": "setup",
                        "casillas y movimiento de unidades": "tiles",
                        "infraestructura": "infrastructure",
                        "unidades": "units",
                        "equipo": "equipment",
                        "arsenal": "arsenal",
                        "recolección de ipc": "collection",
                        "producción": "production",
                        "combate": "combat",
                        "turno": "turn",
                        "prueba de conceptos": "poc",
                        "desarrollos (bajo desarrollo ...)": "developments"
                    };

                    const slugify = (str) => {
                        return str
                            .toLowerCase()
                            .trim()
                            .replace(/[^\w\s-]/g, '')
                            .replace(/[\s_-]+/g, '-')
                            .replace(/^-+|-+$/g, '');
                    };

                    const renderer = new marked.Renderer();
                    
                    // Style headings with custom mapping and custom IDs
                    renderer.heading = function({ text, depth, raw }) {
                        const cleanText = text.replace(/<[^>]*>/g, '').trim();
                        const key = cleanText.toLowerCase();
                        const id = headingIdMap[key] || slugify(cleanText);
                        return `<h${depth} id="${id}">${text}</h${depth}>`;
                    };

                    marked.use({ renderer });

                    // Render markdown to HTML
                    document.getElementById('content').innerHTML = marked.parse(markdown);

                    // If a hash is present in the URL, scroll to it after rendering completes
                    if (window.location.hash) {
                        const id = window.location.hash.substring(1);
                        const targetElement = document.getElementById(id) || document.getElementById(decodeURIComponent(id));
                        if (targetElement) {
                            setTimeout(() => {
                                targetElement.scrollIntoView({ behavior: 'smooth' });
                            }, 150);
                        }
                    }

                    // Dynamically generate Sidebar Table of Contents based on H2 headings rendered
                    const h2Headings = document.querySelectorAll('#content h2');
                    if (h2Headings.length > 0) {
                        const tocContainer = document.getElementById('toc-container');
                        tocContainer.innerHTML = ''; // clear loading state
                        
                        h2Headings.forEach(h2 => {
                            const li = document.createElement('li');
                            li.className = 'toc-item';
                            li.innerHTML = `<a href="#${h2.id}">${h2.textContent}</a>`;
                            tocContainer.appendChild(li);
                        });
                    }
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `
                        <div style="color: var(--accent-red); font-family: var(--font-mono); padding: 2rem; border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05); border-radius: 0.5rem;">
                            <h3 style="color: var(--accent-red); margin-bottom: 0.5rem;">[ERROR: FALLO AL DESENCRIPTAR]</h3>
                            <p style="margin-bottom: 0;">No se pudo conectar con el nodo de reglas. Detalles: ${err.message}</p>
                        </div>
                    `;
                    console.error(err);
                });

            // Back to top scrolling behavior
            const backToTopBtn = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>

</html>
